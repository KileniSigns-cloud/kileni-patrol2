<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GPS background test</title>
<!-- B6 device test (routes-and-breadcrumbs plan). Standalone: no app code, no network.
     Everything is kept in this phone's localStorage. Remove this file after the test. -->
<style>
  :root { --bg:#fff; --fg:#111; --mut:#666; --line:#ddd; --pri:#1d4ed8; --ok:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --mut:#999; --line:#333; --pri:#60a5fa; --ok:#4ade80; --bad:#f87171; } }
  body { margin:0; padding:16px; font:16px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  h1 { font-size:20px; margin:0 0 4px; } p { margin:6px 0; } .mut { color:var(--mut); font-size:14px; }
  label { display:flex; gap:10px; align-items:flex-start; padding:10px; border:1px solid var(--line); border-radius:12px; margin:8px 0; }
  button { font:inherit; padding:12px 16px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--fg); width:100%; margin:6px 0; }
  button.pri { background:var(--pri); color:#fff; border-color:var(--pri); }
  pre { white-space:pre-wrap; background:rgba(127,127,127,.12); padding:10px; border-radius:10px; font-size:13px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
<h1>GPS background test</h1>
<p class="mut">Checks whether a 30-second location timer keeps running when the screen locks or the app is in the background. Location stays on this phone.</p>

<div id="setup">
  <label><input type="radio" name="case" value="1" checked> <span><b>1. Screen on, app open.</b> Leave this page on screen for 5 minutes. Keep touching the screen so it doesn't lock.</span></label>
  <label><input type="radio" name="case" value="2"> <span><b>2. Screen locked.</b> Tap Start, press the side button to lock, wait 5 minutes, unlock, come back.</span></label>
  <label><input type="radio" name="case" value="3"> <span><b>3. Other app.</b> Tap Start, open the Camera app and leave it open 5 minutes, then come back.</span></label>
  <label><input type="radio" name="case" value="4"> <span><b>4. Wake Lock, no touch.</b> Tap Start, put the phone down on screen, don't touch it for 5 minutes.</span></label>
  <button class="pri" id="start">Start</button>
</div>

<div id="running" hidden>
  <p><b id="status">Running…</b></p>
  <p class="mut" id="live"></p>
  <button class="pri" id="stop">Stop and show results</button>
</div>

<div id="results" hidden>
  <pre id="summary"></pre>
  <button class="pri" id="copy">Copy results</button>
  <button id="again">Run another case</button>
</div>

<h1 style="margin-top:24px;font-size:16px">Earlier runs on this phone</h1>
<pre id="history" class="mut">None yet.</pre>
<button id="clear">Clear earlier runs</button>

<script>
(() => {
  const TICK_MS = 30000;
  const KEY = 'gpsTest.runs';
  const $ = (id) => document.getElementById(id);
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } };
  const save = (runs) => { try { localStorage.setItem(KEY, JSON.stringify(runs)); } catch {} };

  let run = null, timer = null, watchId = null, wakeLock = null, liveTimer = null;

  const log = (k, extra = {}) => {
    if (!run) return;
    run.events.push({ k, t: Date.now(), vis: document.visibilityState, ...extra });
    const runs = load(); runs[run.index] = run; save(runs);
  };

  const fixOf = (p) => ({ lat: +p.coords.latitude.toFixed(5), lng: +p.coords.longitude.toFixed(5), acc: Math.round(p.coords.accuracy) });

  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) { log('wakelock-unsupported'); return; }
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      log('wakelock-on');
      wakeLock.addEventListener('release', () => log('wakelock-released'));
    } catch (e) { log('wakelock-error', { msg: String(e && e.message || e) }); }
  }

  function tick() {
    log('tick');
    navigator.geolocation.getCurrentPosition(
      (p) => log('tick-fix', fixOf(p)),
      (e) => log('tick-error', { code: e.code, msg: e.message }),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 },
    );
  }

  $('start').onclick = async () => {
    if (!('geolocation' in navigator)) { alert('This browser has no location support.'); return; }
    const kase = document.querySelector('input[name=case]:checked').value;
    const runs = load();
    run = { index: runs.length, kase, ua: navigator.userAgent, standalone: matchMedia('(display-mode: standalone)').matches || navigator.standalone === true, start: Date.now(), end: null, events: [] };
    runs.push(run); save(runs);
    $('setup').hidden = true; $('running').hidden = false; $('results').hidden = true;
    log('start');
    if (kase === '4') await requestWakeLock();
    watchId = navigator.geolocation.watchPosition((p) => log('watch-fix', fixOf(p)), (e) => log('watch-error', { code: e.code, msg: e.message }), { enableHighAccuracy: true, maximumAge: 0 });
    tick();
    timer = setInterval(tick, TICK_MS);
    liveTimer = setInterval(() => {
      const s = Math.round((Date.now() - run.start) / 1000);
      const ticks = run.events.filter((e) => e.k === 'tick').length;
      $('live').textContent = `Case ${kase} · ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} elapsed · ${ticks} ticks recorded`;
    }, 1000);
  };

  ['visibilitychange', 'pagehide', 'pageshow', 'freeze', 'resume'].forEach((ev) =>
    (ev === 'visibilitychange' ? document : window).addEventListener(ev, () => {
      log(ev);
      // A wake lock is released whenever the page is hidden; take it again on return.
      if (ev === 'visibilitychange' && document.visibilityState === 'visible' && run && run.kase === '4' && !run.end) requestWakeLock();
    }, { capture: true }));

  function summarize(r) {
    const dur = ((r.end || Date.now()) - r.start) / 1000;
    const ticks = r.events.filter((e) => e.k === 'tick').map((e) => e.t);
    const tickFixes = r.events.filter((e) => e.k === 'tick-fix').length;
    const watchFixes = r.events.filter((e) => e.k === 'watch-fix').map((e) => e.t);
    const gaps = (ts) => ts.slice(1).map((t, i) => (t - ts[i]) / 1000);
    const maxGap = (ts) => Math.round(Math.max(0, ...gaps([r.start, ...ts, r.end || Date.now()])));
    const expected = Math.floor(dur / 30) + 1;
    const hidden = r.events.filter((e) => ['visibilitychange', 'pagehide', 'freeze'].includes(e.k) && e.vis === 'hidden').length;
    const errors = r.events.filter((e) => e.k.endsWith('error')).map((e) => `${e.k} ${e.code ?? ''} ${e.msg ?? ''}`.trim());
    const wl = r.events.filter((e) => e.k.startsWith('wakelock')).map((e) => e.k);
    const verdict = ticks.length >= expected - 1 && maxGap(ticks) <= 45 ? 'TIMER KEPT RUNNING' : 'GAPS (timer stopped or slowed)';
    return [
      `Case ${r.kase} — ${verdict}`,
      `Duration: ${Math.round(dur)} s`,
      `30 s ticks: ${ticks.length} of ${expected} expected; longest gap ${maxGap(ticks)} s`,
      `Fixes from ticks: ${tickFixes}; fixes from watchPosition: ${watchFixes.length} (longest gap ${maxGap(watchFixes)} s)`,
      `Page hidden events: ${hidden}`,
      wl.length ? `Wake Lock: ${wl.join(', ')}` : null,
      errors.length ? `Errors: ${[...new Set(errors)].join(' | ')}` : null,
      `Installed app: ${r.standalone ? 'yes' : 'no (browser tab)'}`,
      `Device: ${r.ua}`,
    ].filter(Boolean).join('\n');
  }

  function stop() {
    if (!run) return;
    clearInterval(timer); clearInterval(liveTimer);
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    if (wakeLock) wakeLock.release().catch(() => {});
    run.end = Date.now(); log('stop');
    $('summary').textContent = summarize(run);
    $('running').hidden = true; $('results').hidden = false;
    run = null; showHistory();
  }

  function showHistory() {
    const runs = load();
    $('history').textContent = runs.length ? runs.map(summarize).join('\n\n') : 'None yet.';
  }

  $('stop').onclick = stop;
  $('again').onclick = () => { $('results').hidden = true; $('setup').hidden = false; };
  $('copy').onclick = async () => {
    const text = load().map(summarize).join('\n\n');
    try { await navigator.clipboard.writeText(text); $('copy').textContent = 'Copied'; }
    catch { $('history').textContent = text; alert('Copy failed: select the text under "Earlier runs" instead.'); }
  };
  $('clear').onclick = () => { if (confirm('Clear all earlier runs on this phone?')) { save([]); showHistory(); } };
  showHistory();
})();
</script>
</body>
</html>
