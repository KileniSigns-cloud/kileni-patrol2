<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patrol · full app mockup (olive)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#FBF6EC;--sf:#FFFFFF;--sf2:#F5E9D2;--line:#E8D9BB;--tx:#2A2816;--mut:#66604A;--pri:#726E2B;--prit:#FFFFFF;--prix:#635F24;--pris:#EFEEDB;--acc:#AE431E;--accs:#F8E4DA;--ok:#2F7A5E;--oks:#E1F1EA;--sh:0 1px 2px rgba(42,40,22,.05),0 6px 20px rgba(42,40,22,.06);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15140E;--sf:#1E1D15;--sf2:#29271C;--line:#3B382A;--tx:#F5EEDC;--mut:#B8AF97;--pri:#B8B35A;--prit:#1A190A;--prix:#C4BF66;--pris:#2E2D14;--acc:#D06224;--accs:#3C2116;--ok:#6FC3A0;--oks:#16302A;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15140E;--sf:#1E1D15;--sf2:#29271C;--line:#3B382A;--tx:#F5EEDC;--mut:#B8AF97;--pri:#B8B35A;--prit:#1A190A;--prix:#C4BF66;--pris:#2E2D14;--acc:#D06224;--accs:#3C2116;--ok:#6FC3A0;--oks:#16302A;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100vh}
#hdr{position:sticky;top:0;z-index:6;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px}
.hrow,.hrow2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.2px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--pri);color:var(--prit);display:grid;place-items:center}.logo svg{width:20px;height:20px}
.hr{display:flex;gap:8px;align-items:center}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sf);display:grid;place-items:center}
.ib svg{width:20px;height:20px}
.seg{display:flex;background:var(--sf2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:9px;padding:0 12px;min-height:40px;font-weight:700;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--tx);box-shadow:var(--sh)}
.seg.sm button{min-height:36px;padding:0 10px;font-size:13px}
.seg.big button{flex:1;min-height:48px}
.cnt{color:var(--mut);margin-left:4px}
.live{margin-top:10px;width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:14px;background:var(--pri);color:var(--prit);padding:0 16px;min-height:50px;font-weight:700}
.live .lt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live b{margin-left:auto;font-variant-numeric:tabular-nums;font-size:19px;letter-spacing:.3px}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none;animation:pulse 1.6s infinite}
main{padding:6px 16px 150px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.4px;margin:8px 0 4px;font-weight:800}
h2{font-size:17px;margin:24px 0 10px;font-weight:800;display:flex;align-items:center;gap:8px}
.sub{color:var(--mut);margin:0 0 16px}
.badge{display:inline-block;background:var(--pris);color:var(--prix);font-weight:800;font-size:13px;border-radius:8px;padding:3px 8px}
.req,.opt{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px}.req{color:var(--acc);background:var(--accs)}.opt{color:var(--mut);background:var(--sf2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--sf);color:var(--tx);font-weight:700;font-size:16px}
.btn svg{width:20px;height:20px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--prit)}
.btn.danger{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dt{color:var(--acc)}
.btn.lg{min-height:56px}.btn.xl{min-height:64px;font-size:18px;border-radius:18px}
.btn.full{width:100%}.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{border:0;background:none;display:inline-flex;align-items:center;gap:2px;color:var(--prix);font-weight:700;min-height:44px;padding:0;margin-left:-4px}
.back svg{width:20px;height:20px}
.linkb{border:0;background:none;color:var(--prix);font-weight:700;padding:0;min-height:44px}
.search{position:relative;margin-bottom:16px}.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mut)}.search input{padding-left:44px}
input,select,textarea{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--sf);padding:12px 14px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pris)}
.bad{border-color:var(--acc)!important}
label.f{display:block;font-weight:800;margin:18px 0 6px}label.f span{color:var(--mut);font-weight:600}
.err{color:var(--acc);font-size:14px;margin-top:6px;font-weight:700}.hint{color:var(--mut);font-size:14px;margin-top:8px}
.list{display:grid;gap:10px}
.rcard,.bitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh);min-height:72px}
.rcard>svg{color:var(--mut);width:20px;height:20px;flex:none}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column}
.rname{font-weight:800;font-size:17px}.rmeta{color:var(--mut);font-size:14px}
.addsign{color:var(--prix);display:grid}.addsign svg{width:22px;height:22px}
.ti{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--sf2);color:var(--prix);flex:none}.ti svg{width:24px;height:24px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.facts div{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.facts small{display:block;color:var(--mut);font-size:13px}.facts b{font-size:14px}
@media (max-width:380px){.facts{grid-template-columns:1fr}}
.hots{list-style:none;padding:0;margin:0;display:grid;gap:8px}.hots li{display:flex;gap:10px;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700}.hots svg{color:var(--acc);width:20px;height:20px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.foot .in{max-width:528px;margin:0 auto;display:flex;gap:10px;flex-direction:column}
.r{display:flex;gap:10px}.r .btn{flex:1}.r .btn.pri,.r .btn.danger{flex:2}
.fhint{margin:0;color:var(--mut);font-size:14px;text-align:center;font-weight:600}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{max-width:560px;margin:0 auto;display:flex}
#nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:66px;font-size:12px;font-weight:700;color:var(--mut);position:relative}
#nav button svg{width:24px;height:24px}
#nav button[aria-current=page]{color:var(--prix)}
.pip{position:absolute;top:12px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--acc)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stats3 div{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.stats3 b{display:block;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}.stats3 small{color:var(--mut);font-size:13px;font-weight:600}
.steps{display:flex;gap:6px;margin:8px 0 6px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--pri)}
.stepl{font-size:13px;color:var(--mut);font-weight:700}
.ctx{display:inline-flex;gap:6px;align-items:center;background:var(--sf2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;margin:10px 0 0}.ctx svg{width:16px;height:16px}
.gps{display:flex;gap:12px;align-items:center;border-radius:16px;padding:14px;margin-bottom:10px}
.gps.need{background:var(--pris)}.gps.ok{background:var(--oks)}
.gps>svg{width:28px;height:28px;flex:none}.gps.need>svg{color:var(--prix)}.gps.ok>svg{color:var(--ok)}
.gps>div{flex:1}.gps small{display:block;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--sf2);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .up{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.7);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:3px 8px;display:flex;gap:4px;align-items:center}
.ph .up svg{width:12px;height:12px}
.ph .rm{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;display:grid;place-items:center}.ph .rm svg{width:18px;height:18px}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--pri);background:var(--pris);color:var(--prix);font-weight:800;font-size:14px;cursor:pointer}
.ph.add svg{width:28px;height:28px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.tiles{display:grid;gap:10px}.tiles.two{grid-template-columns:1fr 1fr}
.tile{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:80px;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:var(--sf)}
.tile b{display:block;font-size:17px}.tile small{color:var(--mut);font-size:14px}
.tile[aria-pressed=true]{border-color:var(--pri);background:var(--pris)}
.tile[aria-pressed=true] .ti{background:var(--pri);color:var(--prit)}
.tiles.two .tile{flex-direction:column;align-items:flex-start;min-height:124px;gap:10px}
.tiles.two .tile b{font-size:15px;line-height:1.3}
.chk{position:relative;display:flex;align-items:center;gap:14px;min-height:56px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--sf);font-weight:700;cursor:pointer}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk .box svg{width:16px;height:16px}
.chk input:checked+.box{background:var(--acc);border-color:var(--acc);color:#fff}
.chk:has(input:checked){border-color:var(--acc);background:var(--accs)}
.chk input:focus-visible+.box{outline:2px solid var(--pri);outline-offset:2px}
.done{text-align:center;padding-top:20px}.big{width:88px;height:88px;border-radius:50%;background:var(--oks);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}.big svg{width:48px;height:48px}
.sum>div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.sum>div:last-child{border:0}.sum span{color:var(--mut);font-weight:600}.sum b{text-align:right}
.mini{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;color:var(--mut);font-size:14px}.mini b{color:var(--tx)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.acts .btn{flex:1;min-height:48px;min-width:92px}
.empty{text-align:center;padding:32px 20px;border:1.5px dashed var(--line);border-radius:18px;background:var(--sf)}
.ei{width:56px;height:56px;border-radius:16px;background:var(--pris);color:var(--prix);display:grid;place-items:center;margin:0 auto 10px}.ei svg{width:28px;height:28px}
.empty>b{display:block;font-size:17px}.empty p{color:var(--mut);margin:6px 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--pris);color:var(--prix);border-radius:999px;padding:4px 4px 4px 12px;font-size:14px;font-weight:700}
.chip button{background:none;border:0;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:inherit}.chip svg{width:16px;height:16px}
.addrow{display:flex;gap:8px}.addrow input{flex:1}.addrow .btn{width:52px;padding:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--sf)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:13px;color:var(--mut);font-weight:800;background:var(--sf2)}
.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.inprog{color:var(--prix);font-weight:800}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:var(--mut);font-size:14px;gap:8px;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:end center;padding:16px;z-index:20}
@media (min-width:600px){.ov{place-items:center}}
.dlg{background:var(--sf);border-radius:22px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg h2{margin:0;font-size:20px}.dlg p{color:var(--mut);margin:8px 0 20px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:30;background:var(--tx);color:var(--bg);border-radius:14px;padding:12px 16px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
.toast svg{width:18px;height:18px;color:var(--ok)}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
.spin.s{width:10px;height:10px;border-width:2px}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header id="hdr"></header>
  <main id="main"></main>
</div>
<nav id="nav" aria-label="Main"></nav>
<div id="layer"></div><div id="toastc" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=n=>`<i data-lucide="${n}"></i>`;
const icons=()=>lucide.createIcons();
const hm=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
const fmtD=iso=>new Date(iso+'T12:00').toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'});
const coords=g=>g?`${g.lat.toFixed(5)}, ${g.lng.toFixed(5)}`:'No location';
const ROUTES=[
 {id:1,code:'DT-01',name:'Downtown Core',desc:'Yonge St from Queen to Bloor',area:'Commercial',start:'Yonge & Queen',focus:'Illuminated storefronts',hot:['Yonge & Dundas','Bay & Bloor','Eaton Centre west side'],p:9,i:61,arch:null,last:2},
 {id:2,code:'NY-02',name:'North York Centre',desc:'Yonge corridor, Sheppard to Finch',area:'Mixed',start:'Yonge & Sheppard',focus:'Plaza pylons',hot:['Mel Lastman Square','Yonge & Finch'],p:6,i:38,arch:null,last:4},
 {id:3,code:'KL-03',name:'Keele Industrial',desc:'Keele St and Finch Ave W plazas',area:'Industrial',start:'Keele & Finch',focus:'Monument signs',hot:['Keele & Steeles'],p:4,i:27,arch:null,last:7},
 {id:4,code:'SC-04',name:'Scarborough Town Centre',desc:'McCowan and Ellesmere retail',area:'Commercial',start:'McCowan & Ellesmere',focus:'Channel letters',hot:[],p:0,i:0,arch:null,last:null},
 {id:5,code:'ET-05',name:'Etobicoke Lakeshore',desc:'Lakeshore Blvd W strip',area:'Mixed',start:'Lakeshore & Park Lawn',focus:'',hot:[],p:2,i:11,arch:'2026-09-02',last:21}];
const ISSUES=['Damaged / Impact damage','Loose / Structurally unsafe','Falling / Leaning','Partially lit','Fully dark / Not illuminated','Peeling graphics','Faded / Sun bleached','Missing letters or elements','Other'];
const STEPS=['Business','Photos','Patrol type','Sign type','Issues'];
const FLOW=['biz','photos','ptype','stype','issues','success'];
const PAST=[
 {code:'DT-01',name:'Downtown Core',who:'M. Rossi',start:new Date(2026,8,21,19,5),min:84,biz:7,signs:11,photos:26},
 {code:'NY-02',name:'North York Centre',who:'J. Chen',start:new Date(2026,8,20,10,30),min:62,biz:5,signs:6,photos:14},
 {code:'KL-03',name:'Keele Industrial',who:'A. Okafor',start:new Date(2026,8,18,9,15),min:47,biz:3,signs:4,photos:9}];
let S={theme:null,role:'admin',screen:'routes',q:'',route:null,sess:null,biz:null,insp:null,reuse:false,gpsBusy:false,saving:false,
 a:{tab:'Active',hist:null,page:0,form:null,hots:[],errs:{},busy:false}};
const newI=pt=>({sign:[],surr:[],ptype:pt||null,cat:'Illuminated',type:null,issues:[],notes:''});
const dark=()=>S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const clock=()=>{const t=Math.floor((Date.now()-S.sess.start)/1000);return [t/3600,t%3600/60,t%60].map(v=>String(Math.floor(v)).padStart(2,'0')).join(':')};
const empty=(i,t,b,btn,id)=>`<div class="empty"><div class="ei">${ic(i)}</div><b>${t}</b><p>${b}</p>${btn?`<button class="btn pri" id="${id}">${btn}</button>`:''}</div>`;
const foot=h=>`<div class="foot"><div class="in">${h}</div></div>`;
const stepper=i=>`<div class="steps" aria-hidden="true">${STEPS.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div><div class="stepl">Step ${i+1} of 5: ${STEPS[i]}</div>`;
function go(s){S.screen=s;render();scrollTo(0,0)}
function toast(m){const c=$('#toastc');c.innerHTML=`<div class="toast" role="status">${ic('check-circle-2')}${esc(m)}</div>`;icons();clearTimeout(toast.t);toast.t=setTimeout(()=>c.innerHTML='',3000)}
function ask({title,body,ok,danger}){return new Promise(res=>{
 $('#layer').innerHTML=`<div class="ov" id="ov"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlt"><h2 id="dlt">${title}</h2><p>${body}</p><div class="r"><button class="btn" id="dn">Cancel</button><button class="btn ${danger?'danger':'pri'}" id="dy">${ok}</button></div></div></div>`;
 const done=v=>{$('#layer').innerHTML='';document.removeEventListener('keydown',k);res(v)},k=e=>{if(e.key==='Escape')done(false)};
 document.addEventListener('keydown',k);$('#dn').onclick=()=>done(false);$('#dy').onclick=()=>done(true);$('#ov').onclick=e=>{if(e.target.id==='ov')done(false)};$('#dy').focus()})}
async function cancelFlow(){const I=S.insp,b=S.biz,dirty=I.sign.length||I.surr.length||(!S.reuse&&(b.gps||b.name||b.address));

 ${N?`<div class="tbl"><table><thead><tr><th>Date</th><th>Start</th><th>Patroller</th><th class="n">Duration (h:mm)</th><th class="n">Inspections</th><th class="n">Photos</th></tr></thead><tbody>
 ${rows.map(s=>`<tr><td>${s.d.toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'})}</td><td>${s.d.toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit'})}</td><td>${s.who}</td><td class="n">${s.dur===null?'<span class="inprog">In progress</span>':hm(s.dur)}</td><td class="n">${s.ins}</td><td class="n">${s.ph}</td></tr>`).join('')}</tbody></table></div>
 <div class="pager"><button class="btn sm" id="nw" ${A.page===0?'disabled':''}>Newer</button><span>${a+1}–${Math.min(a+10,N)} of ${N}</span><button class="btn sm" id="ol" ${a+10>=N?'disabled':''}>Older</button></div>`
 :empty('footprints','No patrols yet','Patrols appear here once someone starts this route from the Routes list.')}`,
 b(){$('#bk').onclick=()=>go('admin');$('#nw')?.addEventListener('click',()=>{A.page--;render()});$('#ol')?.addEventListener('click',()=>{A.page++;render()})}}},
gate(){return{h:`<div class="empty" style="margin-top:24px"><div class="ei" style="background:var(--accs);color:var(--acc)">${ic('shield-alert')}</div><b>Admins only</b><p>Route management is limited to admin accounts. Ask an admin if a route needs changing.</p><button class="btn" id="toR">Back to routes</button></div>`,b(){$('#toR').onclick=()=>go('routes')}}}
};

function hdr(){const d=dark();
 $('#hdr').innerHTML=`<div class="hrow"><div class="brand"><span class="logo">${ic('scan-eye')}</span>Patrol</div><div class="hr"><div class="seg sm" role="group" aria-label="Demo role">${['admin','patroller'].map(r=>`<button data-role="${r}" aria-pressed="${S.role===r}">${r[0].toUpperCase()+r.slice(1)}</button>`).join('')}</div><button class="ib" id="thm" aria-label="Switch to ${d?'day':'night'} mode">${ic(d?'sun':'moon')}</button></div></div>
 ${S.sess?`<button class="live" id="tb"><span class="dot"></span><span class="lt">Patrolling ${esc(S.sess.route.code)}</span><b id="tv">${clock()}</b></button>`:''}`;
 $$('[data-role]').forEach(b=>b.onclick=()=>{S.role=b.dataset.role;render()});
 $('#thm').onclick=()=>{S.theme=dark()?'light':'dark';render()};
 const tb=$('#tb');if(tb)tb.onclick=()=>{if(!FLOW.includes(S.screen))go('active')}}
function nav(){const t=[['routes','map','Routes'],['active','footprints','Patrol'],['history','clock-3','History']];if(S.role==='admin')t.push(['admin','sliders-horizontal','Admin']);
 const cur=S.screen.startsWith('admin')?'admin':S.screen;
 $('#nav').innerHTML=`<div class="in">${t.map(([k,i,l])=>`<button data-nav="${k}" ${cur===k?'aria-current="page"':''}>${ic(i)}${l}${k==='active'&&S.sess?'<span class="pip"></span>':''}</button>`).join('')}</div>`;
 $$('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav))}
function render(){
 const root=document.documentElement;S.theme?root.setAttribute('data-theme',S.theme):root.removeAttribute('data-theme');
 hdr();let key=S.screen;if(key.startsWith('admin')&&S.role!=='admin')key='gate';
 const v=V[key]();$('#main').innerHTML=v.h;
 const navOn=['routes','active','history','admin','adminNew','adminHist','gate'].includes(key);
 $('#nav').hidden=!navOn;if(navOn)nav();
 icons();v.b&&v.b();
}
setInterval(()=>{const e=$('#tv');if(e&&S.sess)e.textContent=clock()},1000);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!S.theme)render()});
render();
</script>
</body>
</html>
